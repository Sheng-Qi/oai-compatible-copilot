name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: xvfb-run -a npm test

      - name: Package VSIX
        env:
          TAG: ${{ github.ref_name }}
        run: npx @vscode/vsce package -o "oai-compatible-copilot-${TAG}.vsix"

      - name: Generate checksum
        env:
          TAG: ${{ github.ref_name }}
        run: sha256sum "oai-compatible-copilot-${TAG}.vsix" > "oai-compatible-copilot-${TAG}.vsix.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "oai-compatible-copilot-${TAG}.vsix" \
            "oai-compatible-copilot-${TAG}.vsix.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes